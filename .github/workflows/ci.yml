name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  v1-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          pip install -e "v1_banking_core[dev]" || pip install -e v1_banking_core

      - name: Lint with ruff
        run: ruff check v1_banking_core/banking_core --output-format=github

      - name: Test with pytest
        run: pytest v1_banking_core/tests -v --tb=short

  v2-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          pip install -e "v1_banking_core[dev]" || pip install -e v1_banking_core
          pip install -e v2_cli

      - name: Test with pytest
        run: pytest v2_cli/tests -v --tb=short

  v3-web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          pip install -e "v1_banking_core[dev]" || pip install -e v1_banking_core
          pip install -e v3_web

      - name: Test with pytest
        run: pytest v3_web/tests -v --tb=short
