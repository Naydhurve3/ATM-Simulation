name: Precompute Snapshots

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  precompute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e v1_banking_core

      - name: Run analysis precompute (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python v3_web/scripts/precompute_analysis.py --banks 3 --users 1,27,28,29,31,32,33

      - name: Notify on failure
        if: failure()
        run: echo "Precompute failed — check logs. DATABASE_URL secret must be set in repo settings."
