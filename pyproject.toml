[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atm-simulation"
version = "4.0.0"
description = "ATM & Banking Ecosystem with 20 ML/DL models — Web + CLI"
requires-python = ">=3.10"

[project.optional-dependencies]
web = [
    "flask>=3.0.0",
    "gunicorn>=22.0.0",
]
ml = [
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "prophet>=1.1.0",
]
dl = [
    "tensorflow>=2.13.0",
]
reports = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    "fpdf2>=2.5.0",
]
cli = [
    "rich>=13.0.0",
    "plotext>=5.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
