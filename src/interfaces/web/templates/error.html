{% extends "base.html" %}
{% block title %}Error - ATM Banking{% endblock %}
{% block content %}
<div class="screen">
    <div class="atm-header">
        <div class="atm-brand">
            <div class="atm-icon">&#9888;</div>
            <h1>ERROR</h1>
        </div>
        <p class="subtitle">Something went wrong</p>
    </div>
    <div class="empty-state">
        <p>{{ message }}</p>
    </div>
    <div class="atm-footer-links">
        <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </div>
</div>
{% endblock %}
