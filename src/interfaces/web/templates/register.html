{% extends "base.html" %}
{% block title %}Register - ATM Banking{% endblock %}
{% block content %}
<div class="screen">
    <div class="atm-header">
        <div class="atm-brand">
            <div class="atm-icon">&#9776;</div>
            <h1>NEW ACCOUNT</h1>
        </div>
        <p class="subtitle">Open your banking account</p>
    </div>
    <form method="POST" class="atm-form">
        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required autofocus>
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label for="phone">Phone (10 digits)</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit phone" maxlength="10" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div class="input-group">
            <label for="pin">Create PIN (4 digits)</label>
            <input type="password" id="pin" name="pin" placeholder="Create a 4-digit PIN" maxlength="4" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div class="input-group">
            <label for="confirm_pin">Confirm PIN</label>
            <input type="password" id="confirm_pin" name="confirm_pin" placeholder="Re-enter PIN" maxlength="4" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <button type="submit" class="atm-btn">CREATE ACCOUNT</button>
    </form>
    <div class="atm-footer-links">
        <a href="{{ url_for('auth.login') }}">Already have an account? Login</a>
    </div>
</div>
{% endblock %}
