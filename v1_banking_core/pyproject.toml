[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-core"
version = "1.0.0"
description = "V1 — ATM & Banking research core: domain rules, services, ML/DL models, data pipeline (no UI)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=1.7.0",
    "prophet>=1.1.0",
]
dl = ["tensorflow>=2.13.0"]
reports = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    "fpdf2>=2.5.0",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["banking_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"
