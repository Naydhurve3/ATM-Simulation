{% extends "base.html" %}
{% block title %}Change PIN — ATM Intelligence{% endblock %}
{% block content %}
<div class="page-head reveal in">
    <div>
        <span class="page-eyebrow">Account Settings</span>
        <h1>Change PIN</h1>
        <p class="page-desc">Keep your PIN safe — use a mix of digits you'll remember.</p>
    </div>
</div>

<div class="glass-card reveal" style="max-width:520px">
    <form method="post" action="{{ url_for('routes.change_pin') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-head">
            <div class="card-title">Security update</div>
            <div class="card-subtitle">All PINs are stored as salted hashes</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="current_pin">Current PIN</label>
            <input class="form-control" type="password" name="current_pin" id="current_pin" inputmode="numeric" maxlength="4" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="new_pin">New PIN</label>
            <input class="form-control" type="password" name="new_pin" id="new_pin" inputmode="numeric" maxlength="4" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm_pin">Confirm New PIN</label>
            <input class="form-control" type="password" name="confirm_pin" id="confirm_pin" inputmode="numeric" maxlength="4" required>
        </div>
        <div class="flex flex-wrap">
            <button class="btn btn--primary" type="submit">Change PIN</button>
            <a class="btn btn--ghost" href="{{ url_for('routes.profile') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
