{% extends "base.html" %}
{% block title %}Deposit - ATM Banking{% endblock %}
{% block content %}
<div class="screen">
    <div class="atm-header">
        <div class="atm-brand">
            <div class="atm-icon">+</div>
            <h1>DEPOSIT</h1>
        </div>
        <p class="subtitle">Add funds to your account</p>
    </div>
    <form method="POST" class="atm-form">
        <div class="input-group">
            <label for="amount">Amount (&#8377;)</label>
            <input type="number" id="amount" name="amount" placeholder="Enter amount (multiples of 100)" min="100" step="100" required autofocus>
        </div>
        <button type="submit" class="atm-btn">DEPOSIT</button>
    </form>
    <div class="atm-footer-links">
        <a href="{{ url_for('routes.dashboard') }}">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
