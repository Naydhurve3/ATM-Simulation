{% extends "base.html" %}
{% block title %}{{ code }} — ATM Intelligence{% endblock %}
{% block content %}
<div class="error-hero">
    <div class="code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="flex">
        <a class="btn btn--primary" href="{{ url_for('routes.dashboard') if session.get('user_id') else url_for('auth.login') }}">← Back to {{ 'dashboard' if session.get('user_id') else 'login' }}</a>
    </div>
</div>
{% endblock %}
