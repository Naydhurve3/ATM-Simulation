{% extends "base.html" %}
{% block title %}Feedback - ATM Banking{% endblock %}
{% block content %}
<div class="screen">
  <div class="atm-header"><div class="atm-brand"><div class="atm-icon">&#9993;</div><h1>FEEDBACK</h1></div><p class="subtitle">Help us improve</p></div>
  <form method="POST" class="atm-form">
    <div class="input-group"><label>Category</label>
      <select name="category">
        <option value="general">General</option><option value="bug">Bug Report</option>
        <option value="feature">Feature Request</option><option value="complaint">Complaint</option>
        <option value="praise">Praise</option>
      </select>
    </div>
    <div class="input-group"><label>Rating (1-5)</label>
      <div style="display:flex;gap:8px;justify-content:center;">{% for i in range(1,6) %}
        <label style="font-size:28px;cursor:pointer;"><input type="radio" name="rating" value="{{ i }}" style="display:none;">{{ '⭐' if i <= 3 else '⭐' }}</label>{% endfor %}
      </div>
    </div>
    <div class="input-group"><label>Comments</label><textarea name="comments" rows="4" placeholder="Tell us what you think..." style="width:100%;padding:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:13px;resize:vertical;"></textarea></div>
    <button type="submit" class="atm-btn">SUBMIT</button>
  </form>
  <div class="atm-footer-links"><a href="{{ url_for('routes.dashboard') }}">Back</a></div>
</div>{% endblock %}
