{% extends "base.html" %}
{% block title %}Login - ATM Banking{% endblock %}
{% block content %}
<div class="screen">
    <div class="atm-header">
        <div class="atm-brand">
            <div class="atm-icon">&#9776;</div>
            <h1>SECURE ATM</h1>
        </div>
        <p class="subtitle">Enter your credentials to continue</p>
    </div>
    <form method="POST" class="atm-form">
        <div class="input-group">
            <label for="identifier">Card / Account / Email / Phone</label>
            <input type="text" id="identifier" name="identifier" placeholder="Enter your identifier" required autofocus>
        </div>
        <div class="input-group">
            <label for="pin">PIN</label>
            <input type="password" id="pin" name="pin" placeholder="Enter 4-digit PIN" maxlength="4" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <button type="submit" class="atm-btn">LOGIN</button>
    </form>
    <div class="atm-footer-links">
        <a href="{{ url_for('auth.register') }}">Create New Account</a>
    </div>
</div>
{% endblock %}
