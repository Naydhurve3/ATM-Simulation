[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-web"
version = "3.0.0"
description = "V3 — Flask web app for the ATM & Banking ecosystem (same features as CLI, over banking-core)"
requires-python = ">=3.10"
dependencies = [
    "banking-core>=1.0.0",
    "flask>=3.0.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
deploy = ["gunicorn>=22.0.0"]

[tool.setuptools.packages.find]
include = ["banking_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
